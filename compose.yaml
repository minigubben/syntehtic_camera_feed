services:
  lava-camera:
    build: .
    ports:
      - "${CAMERA_PORT:-3000}:3000"
    environment:
      CAMERA_NAME: "${CAMERA_NAME:-Camera 1}"
      TZ: "${TZ:-UTC}"
      CAMERA_2_NAME: "${CAMERA_2_NAME:-Camera 2}"
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
